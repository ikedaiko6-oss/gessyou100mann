<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="800" height="320" fill="#f0f9ff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0c4a6e">ハイブリッドバッテリーパックの内部構造(イメージ)</text>

  <rect x="40" y="58" width="720" height="118" rx="22" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
  <text x="60" y="50" font-size="13" fill="#0369a1">バッテリーケース(リアシート下/荷室の下にあることが多い)</text>

  <!-- 13 modules, rounded, soft palette -->
  <g>
    <rect x="55" y="72" width="46" height="86" rx="10" fill="#bae6fd" stroke="#38bdf8"/>
    <rect x="106" y="72" width="46" height="86" rx="10" fill="#bae6fd" stroke="#38bdf8"/>
    <rect x="157" y="72" width="46" height="86" rx="10" fill="#bae6fd" stroke="#38bdf8"/>
    <rect x="208" y="72" width="46" height="86" rx="10" fill="#bae6fd" stroke="#38bdf8"/>
    <rect x="259" y="72" width="46" height="86" rx="10" fill="#bae6fd" stroke="#38bdf8"/>
    <rect x="310" y="72" width="46" height="86" rx="10" fill="#fed7aa" stroke="#fb923c" stroke-width="3"/>
    <rect x="361" y="72" width="46" height="86" rx="10" fill="#bae6fd" stroke="#38bdf8"/>
    <rect x="412" y="72" width="46" height="86" rx="10" fill="#bae6fd" stroke="#38bdf8"/>
    <rect x="463" y="72" width="46" height="86" rx="10" fill="#bae6fd" stroke="#38bdf8"/>
    <rect x="514" y="72" width="46" height="86" rx="10" fill="#bae6fd" stroke="#38bdf8"/>
    <rect x="565" y="72" width="46" height="86" rx="10" fill="#bae6fd" stroke="#38bdf8"/>
    <rect x="616" y="72" width="46" height="86" rx="10" fill="#bae6fd" stroke="#38bdf8"/>
    <rect x="667" y="72" width="46" height="86" rx="10" fill="#bae6fd" stroke="#38bdf8"/>
  </g>
  <text x="78" y="118" text-anchor="middle" font-size="11" fill="#075985">1</text>
  <text x="129" y="118" text-anchor="middle" font-size="11" fill="#075985">2</text>
  <text x="180" y="118" text-anchor="middle" font-size="11" fill="#075985">3</text>
  <text x="231" y="118" text-anchor="middle" font-size="11" fill="#075985">4</text>
  <text x="282" y="118" text-anchor="middle" font-size="11" fill="#075985">5</text>
  <text x="333" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a3412">6</text>
  <text x="384" y="118" text-anchor="middle" font-size="11" fill="#075985">7</text>
  <text x="435" y="118" text-anchor="middle" font-size="11" fill="#075985">8</text>
  <text x="486" y="118" text-anchor="middle" font-size="11" fill="#075985">9</text>
  <text x="537" y="118" text-anchor="middle" font-size="11" fill="#075985">10</text>
  <text x="588" y="118" text-anchor="middle" font-size="11" fill="#075985">11</text>
  <text x="639" y="118" text-anchor="middle" font-size="11" fill="#075985">12</text>
  <text x="690" y="118" text-anchor="middle" font-size="11" fill="#075985">13</text>

  <line x1="333" y1="166" x2="333" y2="205" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
  <text x="333" y="226" text-anchor="middle" font-size="13" fill="#9a3412" font-weight="bold">この1個だけ電圧が低い</text>
  <text x="333" y="244" text-anchor="middle" font-size="13" fill="#9a3412">→ 故障コード「P0A80」が記録される</text>

  <text x="400" y="285" text-anchor="middle" font-size="13" fill="#475569">青色の長方形1つ = 「モジュール」(乾電池を並べたような小さなバッテリー単位)。これが13個(車種により10〜20個)直列につながって1つの駆動用バッテリーになっている。</text>
</svg>
