<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="800" height="380" fill="#f0fdfa"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0c4a6e">THS-II「動力分割機構」のイメージ</text>
  <text x="400" y="54" text-anchor="middle" font-size="13" fill="#475569">エンジン・発電機・駆動用モーターが1つの歯車(プラネタリーギヤ)でつながっている</text>

  <!-- planetary gear -->
  <circle cx="400" cy="205" r="118" fill="none" stroke="#a5f3fc" stroke-width="4"/>
  <circle cx="400" cy="205" r="54" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#0c4a6e">サンギヤ</text>
  <text x="400" y="217" text-anchor="middle" font-size="11" fill="#0369a1">(発電機側)</text>

  <circle cx="400" cy="84" r="36" fill="#bae6fd" stroke="#0ea5e9" stroke-width="2"/>
  <text x="400" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#0c4a6e">発電機</text>
  <text x="400" y="97" text-anchor="middle" font-size="10" fill="#0c4a6e">(MG1)</text>

  <circle cx="294" cy="284" r="36" fill="#fed7aa" stroke="#fb923c" stroke-width="2"/>
  <text x="294" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">エンジン</text>
  <text x="294" y="297" text-anchor="middle" font-size="10" fill="#9a3412">(プラネタリーキャリア)</text>

  <circle cx="506" cy="284" r="36" fill="#bbf7d0" stroke="#34d399" stroke-width="2"/>
  <text x="506" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">駆動モーター</text>
  <text x="506" y="297" text-anchor="middle" font-size="10" fill="#065f46">(MG2・リングギヤ)</text>

  <line x1="400" y1="120" x2="400" y2="149" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="328" y1="255" x2="362" y2="227" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="472" y1="255" x2="438" y2="227" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>

  <rect x="615" y="165" width="155" height="84" rx="18" fill="#ffffff" stroke="#a5f3fc" stroke-width="2"/>
  <text x="692" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#0c4a6e">バッテリー202V</text>
  <text x="692" y="204" text-anchor="middle" font-size="10" fill="#0369a1">↓PCUで昇圧</text>
  <text x="692" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#0c4a6e">最大500Vで</text>
  <text x="692" y="237" text-anchor="middle" font-size="11" font-weight="bold" fill="#0c4a6e">モーターを駆動</text>
  <line x1="615" y1="207" x2="525" y2="207" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="400" y="355" text-anchor="middle" font-size="13" fill="#475569">状況に応じて「モーターのみ」「エンジンのみ」「両方」「発電のみ」を自動的に切り替える</text>
</svg>
